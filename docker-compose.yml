# Monorepo orchestrator. Run from the repo root: `docker compose up --build`.
#   nexoclip-app         -> ./nexoclip-app        (Next.js app)
#   ai-storyboard        -> ./nexoclip-app/services/vimax (Python agent behind web/server.mjs)
#   nexoclip-postgres    -> database
services:
  nexoclip-postgres:
    image: postgres:16-alpine
    container_name: nexoclip-postgres
    environment:
      POSTGRES_DB: nexoclip
      POSTGRES_USER: nexoclip
      POSTGRES_PASSWORD: nexoclip_dev
    ports:
      - "5434:5432"
    volumes:
      - nexoclip-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexoclip -d nexoclip"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  nexoclip-redis:
    image: redis:7-alpine
    container_name: nexoclip-redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-nexoclip_dev_redis}"]
    volumes:
      - nexoclip-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-nexoclip_dev_redis}
    restart: unless-stopped

  ai-storyboard:
    build: ./nexoclip-app/services/vimax
    container_name: ai-storyboard
    environment:
      VIMAX_RUNTIME_TOKEN: ${VIMAX_RUNTIME_TOKEN:?Set VIMAX_RUNTIME_TOKEN in your environment}
      # Shared server-side OpenRouter key for ViMax's LLM, image, video, embedding, and reranking adapters.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      # Agent state is tenant-scoped at /app/.tenants/<tenant-id>.
      - ai-storyboard-tenants:/app/.tenants
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4173/healthz')\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  nexoclip-storyboard-worker:
    build: ./nexoclip-app
    command: ["npm", "run", "worker:storyboard"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://nexoclip:nexoclip_dev@nexoclip-postgres:5432/nexoclip
      REDIS_URL: redis://:${REDIS_PASSWORD:-nexoclip_dev_redis}@nexoclip-redis:6379
      VIMAX_RUNTIME_URL: http://ai-storyboard:4173
      VIMAX_RUNTIME_TOKEN: ${VIMAX_RUNTIME_TOKEN:?Set VIMAX_RUNTIME_TOKEN in your environment}
    depends_on:
      nexoclip-postgres:
        condition: service_healthy
      nexoclip-redis:
        condition: service_healthy
      ai-storyboard:
        condition: service_healthy
    restart: unless-stopped

  nexoclip-app:
    build: ./nexoclip-app
    container_name: nexoclip-app
    ports:
      - "3005:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://nexoclip:nexoclip_dev@nexoclip-postgres:5432/nexoclip
      # Where legacy read/chat proxy routes reach the standalone engine service.
      VIMAX_SERVICE_URL: http://ai-storyboard:4173
      # Durable ViMax admission publishes to Redis; neither is browser-visible.
      REDIS_URL: redis://:${REDIS_PASSWORD:-nexoclip_dev_redis}@nexoclip-redis:6379
      # Server-only MuAPI key (set via shell env or a root .env file). Never NEXT_PUBLIC_.
      MUAPI_API_KEY: ${MUAPI_API_KEY:-}
      # Google OAuth (server-only). Pin the origin so the redirect_uri matches what
      # is registered in the Google Cloud console.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_OAUTH_ORIGIN: ${GOOGLE_OAUTH_ORIGIN:-}
    depends_on:
      nexoclip-postgres:
        condition: service_healthy
      ai-storyboard:
        condition: service_healthy
      nexoclip-redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  # Reuse the existing dev database data (created by the old `open-generative-ai`
  # compose project) so accounts/workflows carry over.
  nexoclip-postgres-data:
    external: true
    name: open-generative-ai_nexoclip-postgres-data
  ai-storyboard-tenants:
  nexoclip-redis-data:
