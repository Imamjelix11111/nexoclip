# Monorepo orchestrator. Run from the repo root: `docker compose up --build`.
# Redis and the storyboard runtime are private; Next and PostgreSQL are exposed for local development.
services:
  nexoclip-postgres:
    image: postgres:16-alpine
    container_name: nexoclip-postgres
    environment:
      POSTGRES_DB: nexoclip
      POSTGRES_USER: nexoclip
      POSTGRES_PASSWORD: nexoclip_dev
    ports:
      - "5434:5432"
    volumes:
      - nexoclip-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexoclip -d nexoclip"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  nexoclip-redis:
    image: redis:7-alpine
    container_name: nexoclip-redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes:
      - nexoclip-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    restart: unless-stopped

  ai-storyboard:
    build: ./nexoclip-app/services/vimax
    container_name: ai-storyboard
    environment:
      VIMAX_RUNTIME_TOKEN: ${VIMAX_RUNTIME_TOKEN:?Set VIMAX_RUNTIME_TOKEN in your environment}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - ai-storyboard-tenants:/app/.tenants
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4173/healthz')\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  nexoclip-migrate:
    build:
      context: ./nexoclip-app
      target: migrate
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://nexoclip:nexoclip_dev@nexoclip-postgres:5432/nexoclip
    depends_on:
      nexoclip-postgres:
        condition: service_healthy
    restart: "no"

  nexoclip-storyboard-worker:
    build:
      context: ./nexoclip-app
      target: worker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://nexoclip:nexoclip_dev@nexoclip-postgres:5432/nexoclip
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@nexoclip-redis:6379
      VIMAX_RUNTIME_URL: http://ai-storyboard:4173
      VIMAX_RUNTIME_TOKEN: ${VIMAX_RUNTIME_TOKEN:?Set VIMAX_RUNTIME_TOKEN in your environment}
      VIMAX_PROGRESS_CALLBACK_URL: http://nexoclip-storyboard-worker:4180/internal/progress
    expose:
      - "4180"
    depends_on:
      nexoclip-postgres:
        condition: service_healthy
      nexoclip-migrate:
        condition: service_completed_successfully
      nexoclip-redis:
        condition: service_healthy
      ai-storyboard:
        condition: service_healthy
    restart: unless-stopped

  spite:
    build:
      context: ./nexoclip-app/services/spite
      args:
        NEXT_PUBLIC_BASE_PATH: /spite
        NEXT_PUBLIC_STUDIO_URL: http://localhost:3000/studio
    container_name: nexoclip-spite
    ports:
      - "3005:3005"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL_SPITE:?DATABASE_URL_SPITE is required}
      APP_PASSWORD: ${SPITE_APP_PASSWORD:?SPITE_APP_PASSWORD is required}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-${GOOGLE_API_KEY:-}}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      BYTEPLUS_API_KEY: ${BYTEPLUS_API_KEY:?BYTEPLUS_API_KEY is required}
      BYTEPLUS_BASE_URL: ${BYTEPLUS_BASE_URL:-https://ark.ap-southeast.bytepluses.com/api/v3}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?R2_ACCOUNT_ID is required}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID is required}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY is required}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:?R2_BUCKET_NAME is required}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      R2_PROXY_SIGNING_SECRET: ${R2_PROXY_SIGNING_SECRET:-}
    depends_on:
      nexoclip-postgres:
        condition: service_healthy
    restart: unless-stopped

  nexoclip-app:
    build:
      context: ./nexoclip-app
      target: web
      args:
        NEXT_PUBLIC_SPITE_URL: http://localhost:3005/spite
    container_name: nexoclip-app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://nexoclip:nexoclip_dev@nexoclip-postgres:5432/nexoclip
      VIMAX_SERVICE_URL: http://ai-storyboard:4173
      VIMAX_RUNTIME_URL: http://ai-storyboard:4173
      VIMAX_RUNTIME_TOKEN: ${VIMAX_RUNTIME_TOKEN:?Set VIMAX_RUNTIME_TOKEN in your environment}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@nexoclip-redis:6379
      MUAPI_API_KEY: ${MUAPI_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_OAUTH_ORIGIN: ${GOOGLE_OAUTH_ORIGIN:-}
    depends_on:
      nexoclip-postgres:
        condition: service_healthy
      nexoclip-migrate:
        condition: service_completed_successfully
      ai-storyboard:
        condition: service_healthy
      nexoclip-redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  nexoclip-postgres-data:
    external: true
    name: open-generative-ai_nexoclip-postgres-data
  ai-storyboard-tenants:
  nexoclip-redis-data:
