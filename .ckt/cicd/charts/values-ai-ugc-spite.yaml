# Internal Canvas web service. Caddy gateway is the only public route owner.
image:
  repository: asia-southeast1-docker.pkg.dev/ckt-shared-platform-registry/ai-ugc/ai-ugc-spite
  tag: ""

ports:
  - name: http
    containerPort: 3005

probes:
  livenessPath: /spite/healthz
  readinessPath: /spite/healthz

config:
  NEXOCLIP_INTERNAL_URL: http://ai-ugc-app.ai-ugc.svc.cluster.local:3000
  CANVAS_AUTH_URL: http://ai-ugc-spite-realtime.ai-ugc.svc.cluster.local:3007/internal/authorize

externalSecret:
  secretStoreRef:
    name: ai-ugc-spite-gsm
    kind: SecretStore
  target: ai-ugc-spite-gsm
  dataFrom:
    - extract:
        key: ai-ugc-secret-default

networkPolicy:
  allowedIngressFrom:
    - system: ai-ugc
      component: ai-ugc-http
