# Internal NexoClip application. Public traffic enters only through ai-ugc-http.
image:
  repository: asia-southeast1-docker.pkg.dev/ckt-shared-platform-registry/ai-ugc/ai-ugc-app
  tag: ""

ports:
  - name: http
    containerPort: 3000

probes:
  livenessPath: /
  readinessPath: /

config:
  CANVAS_AUTH_URL: http://ai-ugc-spite-realtime.ai-ugc.svc.cluster.local:3007/internal/authorize
  AI_CLIP_RUNTIME_URL: http://ai-ugc-ai-clip.ai-ugc.svc.cluster.local:4175

externalSecret:
  secretStoreRef:
    name: ai-ugc-app-gsm
    kind: SecretStore
  target: ai-ugc-app-gsm
  dataFrom:
    - extract:
        key: ai-ugc-secret-default

networkPolicy:
  allowedIngressFrom:
    - system: ai-ugc
      component: ai-ugc-http
    - system: ai-ugc
      component: ai-ugc-spite
