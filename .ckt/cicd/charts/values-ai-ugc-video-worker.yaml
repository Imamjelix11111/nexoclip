# Internal BullMQ video-generation consumer. No public ingress.
image:
  repository: asia-southeast1-docker.pkg.dev/ckt-shared-platform-registry/ai-ugc/ai-ugc-video-worker
  tag: ""

ports:
  - name: http
    containerPort: 8080

probes:
  livenessPath: /healthz
  readinessPath: /healthz

config:
  GENERATION_WORKER_KIND: video

externalSecret:
  secretStoreRef:
    name: ai-ugc-video-worker-gsm
    kind: SecretStore
  target: ai-ugc-video-worker-gsm
  dataFrom:
    - extract:
        key: ai-ugc-secret-default

networkPolicy:
  allowedIngressFrom: []

rollout:
  canary:
    maxSurge: 0
    maxUnavailable: 1
