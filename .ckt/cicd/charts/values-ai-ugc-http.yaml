# Public Studio gateway. Caddy routes / to NexoClip, /spite to Canvas and
# /spite/ws to the Canvas realtime service on the private cluster network.
image:
  repository: asia-southeast1-docker.pkg.dev/ckt-shared-platform-registry/ai-ugc/ai-ugc-http
  tag: ""

ports:
  - name: http
    containerPort: 8080

probes:
  livenessPath: /healthz
  readinessPath: /healthz

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 25m
    memory: 64Mi

ingress:
  enabled: true
  audience: customer_cekat_ai
  subdomains:
    - studio
  additionalOptionByEnv:
    dev:
      enablePublicIP: true
    stg:
      enablePublicIP: true
    prd:
      enablePublicIP: true

networkPolicy:
  allowedIngressFrom: []
