# Container image coordinates; CI replaces the tag with the immutable published image.
image:
  repository: asia-southeast1-docker.pkg.dev/ckt-shared-platform-registry/ai-ugc/ai-ugc-http
  tag: ""

# Container ports exposed by this Component.
ports:
  - name: http
    containerPort: 3000

# Health checks used by Kubernetes during startup and normal operation.
probes:
  livenessPath: /
  readinessPath: /

externalSecret:
  secretStoreRef:
    name: ai-ugc-http-gsm
    kind: SecretStore
  target: ai-ugc-http-secrets

networkPolicy:
  allowedIngressFrom: []

ingress:
  enabled: true
  audience: customer_cekat_ai
  subdomains:
    - studio
  additionalOptionByEnv:
    prd:
      enablePublicIP: true
