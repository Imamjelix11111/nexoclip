# Public Studio gateway. Caddy routes / to NexoClip, /spite to Canvas and
# /spite/ws to the Canvas realtime service on the private cluster network.
image:
  repository: asia-southeast1-docker.pkg.dev/ckt-shared-platform-registry/ai-ugc/ai-ugc-http
  tag: ""

ports:
  - name: http
    containerPort: 8080

config:
  NEXOCLIP_UPSTREAM: ai-ugc-app.ai-ugc.svc.cluster.local:3000
  SPITE_UPSTREAM: ai-ugc-spite.ai-ugc.svc.cluster.local:3005
  SPITE_REALTIME_UPSTREAM: ai-ugc-spite-realtime.ai-ugc.svc.cluster.local:3007

probes:
  livenessPath: /healthz
  readinessPath: /healthz

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 25m
    memory: 64Mi

externalSecret:
  secretStoreRef:
    name: ai-ugc-http-gsm
    kind: SecretStore
  target: ai-ugc-http-secrets

networkPolicy:
  allowedIngressFrom: []

ingress:
  enabled: true
  audience: customer_cekat_ai
  subdomains:
    - studio
  additionalOptionByEnv:
    dev:
      enablePublicIP: true
    stg:
      enablePublicIP: true
    prd:
      enablePublicIP: true

networkPolicy:
  allowedIngressFrom: []
