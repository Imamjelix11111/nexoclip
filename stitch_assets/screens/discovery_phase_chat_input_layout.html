<!DOCTYPE html>

<style>
        body {
            background-color: #F7F7F2;
            color: #1D1D1B;
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .editorial-shadow {
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
        }
        .italic-placeholder::placeholder {
            font-style: italic;
            font-family: 'Georgia', serif;
            opacity: 0.6;
        }

<body class="min-h-screen flex flex-col">
<!-- TopNavBar -->
<header class="bg-[#F7F7F2] dark:bg-stone-950 border-b border-[#E5E5E0] dark:border-stone-800 flex justify-between items-center w-full px-8 py-4 max-w-full sticky top-0 z-50">
<div class="flex items-center gap-8">
<span class="text-2xl font-bold tracking-tighter text-[#1D1D1B] dark:text-stone-100">NexoClip</span>
<nav class="hidden md:flex gap-6 items-center">
<a class="text-[#D97757] dark:text-orange-400 font-bold border-b-2 border-[#D97757] pb-1 font-inter tracking-tight text-sm" href="#">Studio</a>
<a class="text-[#6B6B66] dark:text-stone-400 hover:text-[#1D1D1B] dark:hover:text-stone-200 transition-colors font-inter tracking-tight font-medium text-sm" href="#">Assets</a>
<a class="text-[#6B6B66] dark:text-stone-400 hover:text-[#1D1D1B] dark:hover:text-stone-200 transition-colors font-inter tracking-tight font-medium text-sm" href="#">Archive</a>
</nav>
</div>
<div class="flex items-center gap-4">
<button class="p-2 hover:bg-stone-100 dark:hover:bg-stone-900 rounded-md transition-all text-[#6B6B66]">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
<button class="p-2 hover:bg-stone-100 dark:hover:bg-stone-900 rounded-md transition-all text-[#6B6B66]">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
<button class="bg-[#D97757] text-white px-5 py-2 rounded-lg font-medium text-sm active:opacity-80 active:scale-[0.99] transition-transform">
                New Project
            </button>
</div>
</header>
<main class="flex-grow flex flex-col items-center justify-center px-6 py-12 max-w-4xl mx-auto w-full">
<!-- Discovery Hero Section -->
<section class="w-full mb-16 text-center">
<h1 class="text-5xl font-extrabold tracking-tighter mb-4 text-[#1D1D1B]">Discovery Studio</h1>
<p class="text-[#6B6B66] text-lg max-w-xl mx-auto font-medium">Shape your vision. Our AI producer will orchestrate the storyboard, talent, and visual style based on your prompt.</p>
</section>
<!-- AI Chat Input Area -->
<div class="w-full bg-white rounded-lg editorial-shadow p-8 mb-12 relative">
<textarea class="w-full border-0 focus:ring-0 text-3xl md:text-4xl text-[#1D1D1B] italic-placeholder resize-none h-48 bg-transparent" placeholder="Describe your vision... e.g., A cinematic TikTok reveal for a premium coffee brand."></textarea>
<div class="absolute bottom-6 right-8 flex gap-3">
<span class="material-symbols-outlined text-[#D97757] text-3xl" data-icon="auto_awesome">auto_awesome</span>
</div>
</div>
<!-- Selection Hub -->
<div class="w-full grid grid-cols-1 md:grid-cols-2 gap-8 mb-16">
<!-- Product Library Section -->
<div class="flex flex-col">
<label class="text-[10px] uppercase tracking-[0.1em] font-bold text-[#6B6B66] mb-4">Product Library</label>
<div class="grid grid-cols-2 gap-4">
<div class="aspect-square rounded-lg border-2 border-dashed border-[#E5E5E0] bg-white flex flex-col items-center justify-center cursor-pointer hover:border-[#D97757] transition-colors group">
<span class="material-symbols-outlined text-[#6B6B66] group-hover:text-[#D97757] mb-2" data-icon="add">add</span>
<span class="text-xs font-bold text-[#6B6B66] group-hover:text-[#D97757]">Upload Product</span>
</div>
<div class="aspect-square rounded-lg bg-stone-200 overflow-hidden relative group cursor-pointer">
<img alt="Premium Coffee Bottle" class="w-full h-full object-cover transition-transform group-hover:scale-105" data-alt="Close-up of a sleek glass coffee bottle with minimalist label on a warm wooden surface with soft shadows" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCqGNGJPsRaY7_wD4wg1I3XPtRIZ6m8T8ui5a-bN8eUmC2P4_Wdx40j7wsVEl1ByIDDDLMXBN15EcHFX2u3U5Q0fw9rQNq-2tkQQajTZkOidX7t8Rh2LnoA-lM2aDgDTB4rj1niIZY8s_SWUd4dJ_sukGrOhLEgZG2XzPHEkeGrW8CHwWV8U7fXp9gz-BrBGxJ8CAvvOe79bcTzXCgy7jlxfUb2vbNdGVE0kmVzPmusI4lDX_NxKhmaqC7PoegoPkoOvGfFKewRvRLK"/>
<div class="absolute inset-0 bg-black/10 group-hover:bg-black/0 transition-colors"></div>
</div>
</div>
</div>
<!-- Avatar/Talent Gallery Section -->
<div class="flex flex-col">
<label class="text-[10px] uppercase tracking-[0.1em] font-bold text-[#6B6B66] mb-4">Avatar / Talent Gallery</label>
<div class="grid grid-cols-2 gap-4">
<div class="aspect-square rounded-lg bg-stone-200 overflow-hidden relative group cursor-pointer">
<img alt="Female Producer Avatar" class="w-full h-full object-cover transition-transform group-hover:scale-105" data-alt="Portrait of a young creative professional woman with warm lighting and a neutral minimalist studio background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBjocPBFRJOYroP9Ew1Qh_mUXeMXngSgC53PoF8yj6KXsvb0oc-CzYJVKbFCQf3OC5X7DpIkkVZjBFSKxrEvcWRydmm_aDPRnYW7p3qKV2DOkn5GBi4-6P29ZcmKpK4ywGhtEWVxOcdB7huAoMedr9lDkbKlCXrKPGKnpYGhTw4tT2KFDc1gPRFfk4mVT9MNO1iG5h3HEXlrMlY7TStjCVxnbxSAjPGuxXLhEcBJ-XJ0lgcqm9f0qIB_kUwDWctgKAYhuAMBhOZtZR1"/>
<div class="absolute inset-0 bg-black/10 group-hover:bg-black/0 transition-colors"></div>
</div>
<div class="aspect-square rounded-lg border-2 border-dashed border-[#E5E5E0] bg-white flex flex-col items-center justify-center cursor-pointer hover:border-[#D97757] transition-colors group">
<span class="material-symbols-outlined text-[#6B6B66] group-hover:text-[#D97757] mb-2" data-icon="person_add">person_add</span>
<span class="text-xs font-bold text-[#6B6B66] group-hover:text-[#D97757]">Choose Talent</span>
</div>
</div>
</div>
</div>
<!-- Primary Action Button -->
<div class="w-full flex justify-center pb-20">
<button class="bg-[#D97757] text-white px-10 py-5 rounded-lg font-bold tracking-tight text-lg shadow-xl shadow-[#D97757]/20 flex items-center gap-3 active:scale-[0.98] transition-transform">
<span class="material-symbols-outlined" data-icon="sparkles" style="font-variation-settings: 'FILL' 1;">colors_spark</span>
                CRAFT STORYBOARD BLUEPRINT
            </button>
</div>
</main>
<!-- Footer Progress Indicator -->
<footer class="fixed bottom-0 left-0 w-full bg-[#F7F7F2]/80 backdrop-blur-md px-8 py-4 border-t border-[#E5E5E0]">
<div class="max-w-4xl mx-auto flex items-center justify-between">
<div class="flex items-center gap-4">
<div class="flex items-center gap-2">
<div class="w-2 h-2 rounded-full bg-[#D97757]"></div>
<span class="text-[10px] uppercase tracking-widest font-bold text-[#1D1D1B]">Discovery</span>
</div>
<div class="w-8 h-[1px] bg-[#E5E5E0]"></div>
<div class="flex items-center gap-2">
<div class="w-2 h-2 rounded-full bg-[#E5E5E0]"></div>
<span class="text-[10px] uppercase tracking-widest font-bold text-[#6B6B66]">Storyboard</span>
</div>
<div class="w-8 h-[1px] bg-[#E5E5E0]"></div>
<div class="flex items-center gap-2">
<div class="w-2 h-2 rounded-full bg-[#E5E5E0]"></div>
<span class="text-[10px] uppercase tracking-widest font-bold text-[#6B6B66]">Generation</span>
</div>
</div>
<span class="text-[10px] uppercase tracking-widest font-bold text-[#6B6B66]">Step 1 of 3</span>
</div>
</footer>
</body></html>
