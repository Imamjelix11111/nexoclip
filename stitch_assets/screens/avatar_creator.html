<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- TopNavBar -->
<header class="bg-[#F7F7F2] dark:bg-stone-950 border-b border-stone-200 dark:border-stone-800 sticky top-0 z-50 flex justify-between items-center px-6 py-3 w-full">

<nav class="hidden md:flex gap-6 items-center">

<a class="font-inter tracking-tight font-semibold text-stone-500 dark:text-stone-400 hover:text-[#D97757] transition-colors duration-200" href="#">Library</a>
<a class="font-inter tracking-tight font-semibold text-stone-500 dark:text-stone-400 hover:text-[#D97757] transition-colors duration-200" href="#">Team</a>
</nav>
</div>
<div class="flex items-center gap-4">
<div class="hidden sm:flex items-center bg-surface-container-low px-3 py-1.5 rounded-full border border-outline-variant">
<span class="material-symbols-outlined text-on-surface-variant text-sm mr-2">search</span>
<input class="bg-transparent border-none focus:ring-0 text-sm w-32 lg:w-48" placeholder="Search resources..." type="text"/>
</div>
<button class="material-symbols-outlined text-stone-500 hover:text-[#D97757] transition-all">notifications</button>
<button class="material-symbols-outlined text-stone-500 hover:text-[#D97757] transition-all">settings</button>
<button class="bg-primary-container text-on-primary px-4 py-2 rounded-full font-bold text-sm scale-98 active:opacity-80 transition-all">Create New</button>
<img alt="User profile" class="w-8 h-8 rounded-full object-cover border border-outline-variant" data-alt="A professional studio headshot of a creative director with a minimalist aesthetic, featuring soft, warm lighting that complements the off-white canvas background. The subject is a woman with a confident expression, and the image quality is crisp with a shallow depth of field, reflecting a high-end editorial production environment." src="https://lh3.googleusercontent.com/aida-public/AB6AXuB9ptIS2fUgwsNQ3PHYPPPpzVr4zg2I9BmFo9iOSLyTa_X_vUJpIiwLtYUdm8T6Yx3aICnRfbojhikljSeKjrJD1Un5yJNJMyM8FlXyhNLElV1Nn3HGob_xLAlPUu-yD2hKw6RTiBdo5Pgivt3_V5vw8Of-HVld6Aq3TGkAtKHh85hzZfvx7VTlaujQQC2UGYXiAKyFOUwMd6HyN7s-G3KXPZHW1x22fxAmdRVETNH7Agd5r6tVKd0CyV3gGc53LLgLe2vFhwyqYrBt"/>

<main class="flex-1 flex flex-col md:flex-row overflow-hidden h-[calc(100vh-64px-100px)]">
<!-- SideNavBar / Left Configuration Panel -->
<aside class="w-full md:w-[360px] bg-[#F7F7F2] border-r border-stone-200 flex flex-col overflow-y-auto p-8">
<div class="mb-8">
<span class="font-inter text-sm font-medium uppercase tracking-widest text-[#D97757] mb-1 block">Editorial Mode</span>
<h1 class="text-3xl font-bold tracking-tight text-on-surface">Avatar Creator</h1>
</div>
<section class="space-y-6">
<!-- Dropzone -->
<div class="group relative aspect-square w-full bg-surface-container-low rounded-xl border-2 border-dashed border-outline-variant flex flex-col items-center justify-center cursor-pointer hover:bg-surface-container transition-all">
<span class="material-symbols-outlined text-6xl text-outline mb-2 group-hover:scale-110 transition-transform">person_add</span>
<p class="text-sm font-medium text-on-surface-variant">Drop portrait or Browse</p>
<p class="text-xs text-tertiary mt-1">PNG, JPG up to 10MB</p>
</div>
<!-- Inputs -->
<div class="space-y-4">
<div class="space-y-1.5">
<label class="font-inter text-[10px] font-bold uppercase tracking-widest text-tertiary">Avatar Name</label>
<input class="w-full bg-white border-outline-variant rounded-lg focus:border-primary-container focus:ring-primary-container text-sm py-3 px-4" placeholder="e.g. Editorial Host" type="text"/>
</div>
<div class="space-y-1.5">
<label class="font-inter text-[10px] font-bold uppercase tracking-widest text-tertiary">Voice Profile</label>
<select class="w-full bg-white border-outline-variant rounded-lg focus:border-primary-container focus:ring-primary-container text-sm py-3 px-4">
<option>Sophisticated - British Male</option>
<option>Warm - American Female</option>
<option>Calm - Nordic Professional</option>
</select>
</div>
<div class="space-y-1.5">
<label class="font-inter text-[10px] font-bold uppercase tracking-widest text-tertiary">Language</label>
<select class="w-full bg-white border-outline-variant rounded-lg focus:border-primary-container focus:ring-primary-container text-sm py-3 px-4">
<option>English (US)</option>
<option>French (FR)</option>
<option>Japanese (JP)</option>
</select>
</div>
</div>
<!-- Preview CTA -->
<button class="w-full py-4 border border-outline text-on-surface font-bold rounded-lg hover:bg-surface-container transition-colors flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-lg">play_circle</span>
                    Generate Preview
                </button>
</section>
</aside>
<!-- Right: Preview Canvas -->
<section class="flex-1 bg-surface-container-low p-8 flex flex-col items-center justify-center relative">
<!-- Scene Badge -->
<div class="absolute top-8 left-8">
<span class="bg-white px-4 py-1.5 rounded-full border border-outline-variant text-sm italic font-medium text-on-surface-variant shadow-sm">
                    Scene 01: Master Preview
                </span>

<div class="w-12 h-12 rounded-full bg-white/20 backdrop-blur-md flex items-center justify-center cursor-pointer hover:bg-white/40 transition-all border border-white/30">
<span class="material-symbols-outlined text-white text-3xl">play_arrow</span>
</div>
</div>
</div>
<!-- Primary CTA -->
<div class="mt-8">
<button class="bg-[#D97757] text-white px-12 py-4 rounded-full font-extrabold text-lg shadow-lg hover:opacity-90 active:scale-95 transition-all flex items-center gap-3">
<span class="material-symbols-outlined" data-weight="fill">movie_edit</span>

                </button>
</div>
</section>
